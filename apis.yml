- aid: segmind:segmind-workflow-api
  name: Segmind PixelFlow Workflow API
  description: >-
    Call a published PixelFlow workflow over REST. Submit to POST /workflows/v2/{slug} with
    the key names given to the workflow's input nodes, poll the status URL, and fetch the
    result — the same async contract and the same x-api-key header as model inference. The
    result's output field is a JSON-stringified array of {keyname, value} pairs, one per
    named output node.
  humanURL: https://docs.segmind.com/docs/pixelflow/api-reference
  baseURL: https://api.segmind.com
  tags:
  - Workflows
  - Automation
  properties:
  - type: APIReference
