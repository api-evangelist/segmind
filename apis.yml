aid: segmind
name: Segmind
description: >-
  Segmind is a serverless GPU inference platform that puts 200+ generative AI models —
  image, video, audio, 3D and LLM — behind one REST gateway with a single API key. Calls
  are metered per GPU-second or per generation against a prepaid credit balance, with the
  cost of every request reported inline on the response. The v2 asynchronous API is a
  submit-poll-fetch job contract built for long-running video and upscaling work, while
  the v1 synchronous route remains for fast models. Alongside the gateway, PixelFlow is a
  visual workflow builder that chains models on a canvas and publishes any workflow as its
  own production REST API, and dedicated endpoints run a chosen model on reserved GPUs
  with autoscaling. A first-party Python SDK, a browser playground, media-editing
  endpoints and a weekly dated changelog round out the developer surface.
