    url: asyncapi/segmind-webhooks.yml
- aid: segmind:segmind-endpoints-api
  name: Segmind Dedicated Endpoints API
  description: >-
    Manage dedicated GPU endpoints programmatically — list, add, update capacity and
    delete. Served from a separate control-plane host and authenticated with the same
    API key. Add, update and delete share one resource that selects the operation from the
    HTTP method.
  humanURL: https://docs.segmind.com/docs/serverless-api/dedicated-endpoints/endpoint-apis
