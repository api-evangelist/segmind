method: probed
source: >-
  Direct HTTPS probes of every apis.yml and OpenAPI servers[] host, plus the docs,
  console and dedicated-endpoint hosts, 2026-08-27.
summary: >-
  Segmind serves no /.well-known/ discovery surface. Every RFC 8615 path probed on every
  host returned 404 or a redirect to a login. Three of the five hosts answer 404 with a
  full HTML application shell (Next.js / Vercel), so byte counts are recorded to make the
  catch-all behaviour visible; none of them returned a document. No WellKnown or
  SecurityTxt pointer is emitted, because none of these probes found a served document.
hit_count: 0
hosts:
