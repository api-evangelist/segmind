        status: 400
      - path: /.well-known/agent.json
        status: 400
  - host: https://workflows-api.segmind.com
    note: Flask-style 404 (207 bytes), not a catch-all shell.
    documents:
      - path: /.well-known/security.txt
        status: 404
      - path: /.well-known/agent-card.json
        status: 404
  - host: https://docs.segmind.com
    note: Docs host; 404s return an 11,260-byte HTML shell.
    documents:
      - path: /.well-known/security.txt
        status: 404
      - path: /.well-known/agent-card.json
        status: 404
  - host: https://platform.segmind.com
    note: >-
      Console. 404s return a 14,803-byte HTML shell. Probed specifically because the
      2026-06-21 release notes announce an OAuth 2.1 authorization server with "endpoints
      under /oauth/" — no RFC 8414 or RFC 9728 metadata document is served for it, and
      /oauth/authorize itself 404s anonymously.
    documents:
      - path: /.well-known/oauth-authorization-server
        status: 404
      - path: /.well-known/oauth-protected-resource
        status: 404
      - path: /.well-known/openid-configuration
        status: 404
