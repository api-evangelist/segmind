        status: 404
      - path: /.well-known/agent.json
        status: 404
  - host: https://api.segmind.com
    note: >-
      The AI Gateway edge answers every unrouted path with HTTP 400 "Incorrect or Missing
      host header" (32 bytes) rather than 404. Routed paths behave normally — GET
      /v1/get-user-credits returns 401 with a JSON error — so the host is live and the 400
      is an edge policy on unknown paths, not a block on our crawler.
    documents:
      - path: /.well-known/security.txt
        status: 400
      - path: /.well-known/oauth-authorization-server
        status: 400
      - path: /.well-known/oauth-protected-resource
