      - path: /.well-known/ai-plugin.json
        status: 404
      - path: /.well-known/agent-card.json
        status: 404
      - path: /.well-known/agent.json
        status: 404
  - host: https://cloud.segmind.com
    note: >-
      Every /.well-known/ path 307s to /auth/login?redirect=... — the whole host is behind
      a session gate, so nothing is discoverable anonymously.
    documents:
      - path: /.well-known/oauth-authorization-server
        status: 307
      - path: /.well-known/agent-card.json
        status: 307
  - host: https://api.spotprod.segmind.com
    note: >-
      Dedicated-endpoints control plane, named only in the docs (not in apis.yml or any
      servers[] block). Live — GET /endpoint/list returns 401 with a JSON error — but
      serves no discovery documents.
    documents:
      - path: /.well-known/agent-card.json
        status: 404
gaps:
  - >-
    No security.txt on any host, so there is no machine-readable route for reporting a
    vulnerability (RFC 9116).
  - >-
    An OAuth 2.1 authorization server is announced in the June 2026 release notes and is
    explicitly aimed at MCP clients, but publishes neither RFC 8414 authorization-server
    metadata nor RFC 9728 protected-resource metadata, so no client can discover it.
