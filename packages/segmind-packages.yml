  API directly in the meantime; the only JS package the org ever published, `segmind-npm`,
  last shipped in October 2023 and is not referenced from the current docs. An earlier
  Python client (github.com/segmind/segmind-py) now carries a deprecation notice in its
  README pointing at segmind-python.
