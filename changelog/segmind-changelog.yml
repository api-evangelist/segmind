  - version: '2026-06-21'
    date: '2026-06-21'
    url: https://docs.segmind.com/docs/platform/release-notes/2026-06-21-weekly
    breaking: false
    additions:
      - >-
        OAuth 2.1 authorization server, endpoints under /oauth/. Third-party applications,
        "including MCP clients", can request scoped, user-authorized access and call the
        API without handling an API key. Described as fully additive — existing API keys
        and sessions keep working. Released 2026-06-16.
      - >-
        Grok Imagine consolidated into a single grok-imagine-image model, with quality and
        image-editing selectable by request parameter instead of separate model variants.
      - >-
        The {"prompt": "..."} shorthand extended across more LLMs; Claude models reliably
        accept image and PDF URL inputs.
      - Model-page API samples reorganised as Mode (Sync/Async) x Language, defaulting to async.
      - PixelFlow single-node runs; 3D gaussian-splat rendering in the playground.
    note: >-
      The most significant API-surface change in the window. Segmind now runs an OAuth 2.1
      server aimed explicitly at MCP clients, but publishes no RFC 8414 or RFC 9728
      discovery metadata for it and no scope reference — see
      well-known/segmind-well-known.yml and scopes/segmind-scopes.yml.
  - version: '2026-06-14'
    date: '2026-06-14'
    url: https://docs.segmind.com/docs/platform/release-notes/2026-06-14-weekly
    breaking: false
    additions:
      - Grok Imagine text-to-image; Bria Video Background Removal 3.0
      - More reliable async inference
      - >-
        API errors returned as structured JSON — unknown model slugs return 404 and
        unexpected failures return a clean 500 instead of raw gateway errors. Calls to
        retired or deprecated models now fail fast with 410 Gone and are not charged.
  - version: '2026-06-07'
