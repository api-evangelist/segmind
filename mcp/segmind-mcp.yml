candidate_tools:
  - name: run_model
    rest: [invokeModelAsync]
    description: >-
      Submit an inference request to any model in the Segmind catalogue and return a
      request id. Maps to POST /v2/{model_name}.
    consequence: billable-write
  - name: get_request_status
    rest: [getRequestStatus]
    description: Check the status and metrics of a submitted request without the output payload.
    consequence: read
  - name: get_request_result
    rest: [getRequestResult]
    description: Fetch the completed result for a request id.
    consequence: read
  - name: run_model_sync
    rest: [invokeModelSync]
    description: >-
      Blocking inference on the v1 route, returning raw output bytes. v1 is in maintenance
      mode; prefer run_model.
    consequence: billable-write
  - name: get_user_credits
    rest: [getUserCredits]
    description: >-
      Read the account's spendable credit balance. Costs nothing and is the natural
      spend-guard check before any billable tool call.
    consequence: read
  - name: upload_asset
    rest: [uploadAsset]
    description: >-
      Upload a file to Segmind Storage and get a reusable URL to pass as model input.
      Served from workflows-api.segmind.com, not the main gateway.
    consequence: write
derivation_note: >-
  Only operations present in openapi/ are listed. The six deprecated fine-tuning
  operations are deliberately excluded because the service no longer accepts new jobs. A
  real Segmind MCP server would also need a model-discovery tool — the catalogue of 200+
  model slugs is published as www.segmind.com/llms.txt (captured in llms/), not as an API
  operation, so no such tool could be derived from the contract.
