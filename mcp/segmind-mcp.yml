summary: >-
  Segmind publishes no MCP server. The candidate tool list below is DERIVED by API
  Evangelist from the operations in this repo's OpenAPI and is not something Segmind
  ships. Recorded because the ingredients are unusually close: Segmind stood up an OAuth
  2.1 authorization server in June 2026 explicitly so that "third-party applications —
  including MCP clients — can request scoped, user-authorized access", and it publishes a
  Claude Code skill of its own (skills/segmind-media-generation.md) — but no MCP endpoint
  and no stdio package exist to point that authorization server at.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: probed
  note: >-
    No hosted endpoint and no installable server were found. mcp.segmind.com does not
    resolve (DNS NXDOMAIN). https://www.segmind.com/mcp, https://www.segmind.com/api/mcp
    and https://platform.segmind.com/mcp all return 404 HTML. https://api.segmind.com/mcp
    returns the gateway's 400 "Incorrect or Missing host header", the same response it
    gives every unrouted path, so it is not a route. No @segmind npm scope exists and no
    MCP server appears in the GitHub org's 16 public repositories.
probes:
